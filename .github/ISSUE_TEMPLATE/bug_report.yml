name: Bug report
description: A calendar, a slot, the order check, the Admin page, the checkout kit or the installation doesn't work as described.
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through a private report instead, see SECURITY.md.
        Never paste `.env` or `.aio` values, workspace credentials, tokens, masked cart IDs or customer data here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the profile (JSON from the Admin or SLOT_PROFILES), the shipping method and store view, and the date and time (with time zone) when it happened.
      placeholder: |
        1. Create a profile with ...
        2. At 17:55 London time, with Flat Rate on store view ..., pick ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Calendar rules (dates, cut-offs, holidays, time zones)
        - Capacity, holds or bookings
        - Place-order check (webhook)
        - Slot fee
        - Order event (confirm, cancel, order comment)
        - Admin page
        - Checkout kit or availability feed
        - Installation or App Management
        - Other
    validations:
      required: true
  - type: dropdown
    id: commerce
    attributes:
      label: Commerce
      options:
        - Adobe Commerce as a Cloud Service (SaaS)
        - Adobe Commerce on cloud infrastructure (PaaS)
        - Adobe Commerce on-premises
        - Not relevant
  - type: input
    id: version
    attributes:
      label: Delivery Slots version or commit
      placeholder: v0.1.0 or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output of `aio app logs`, browser console errors or a screenshot. Remove any secrets and customer data first.
      render: text

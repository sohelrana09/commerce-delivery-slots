extensions:
  commerce/backend-ui/2:
    $include: src/commerce-backend-ui-2/ext.config.yaml
  commerce/configuration/1:
    $include: src/commerce-configuration-1/ext.config.yaml
  commerce/extensibility/1:
    $include: src/commerce-extensibility-1/ext.config.yaml
productDependencies:
  - code: COMMC
    minVersion: 2.4.7
    maxVersion: 3.0.0
configSchema:
  title: Delivery Slots setup
  description: Runtime settings for the Delivery Slots app.
  properties:
    - title: Logging level
      type: string
      description: "How much the app logs. One of: debug, info, warn, error."
      envKey: LOG_LEVEL
      default: info
    - title: Webhook public key (optional)
      type: string
      description: "The Commerce webhook signing public key (PEM). Leave empty to rely on Adobe IMS authentication alone. See docs/webhooks.md."
      envKey: WEBHOOK_PUBLIC_KEY
      default: ""
